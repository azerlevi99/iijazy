{{ define "main" }}
<style>
    .single-berita-container {
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .single-berita-title {
        font-size: 2.2rem;
        color: #1a1a1a;
        margin-bottom: 10px;
    }

    .single-berita-meta {
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 20px;
    }

    .single-berita-thumbnail {
        margin-bottom: 25px;
    }

    .single-berita-thumbnail img {
        width: 100%;
        max-height: 400px;
        object-fit: cover;
        border-radius: 8px;
    }

    .single-berita-divider {
        margin: 20px 0;
        border: 0;
        border-top: 1px solid #eee;
    }

    .laporan-content {
        line-height: 1.8;
        font-size: 1.1rem;
        color: #333;
    }

    .single-berita-tags {
    margin-top: 25px;
    padding-top: 15px;
    border-top: 1px dashed #eee;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    }

    .tag-label {
        font-size: 0.85rem;
        color: #666;
        font-weight: bold;
    }

    .single-berita-back {
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid #eee;
    }

    .single-berita-back a {
        color: #00008B;
        text-decoration: none;
        font-weight: bold;
    }

    .single-berita-back a:hover {
        text-decoration: underline;
    }
</style>

<section class="single-berita-container">
    <h1 class="single-berita-title">{{ .Title }}</h1>
    
    <div class="single-berita-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">
            Dipublikasikan: {{ .Date.Format "02 January 2006" }}
        </time>
    </div>

    {{ with .Params.image }}
    <div class="single-berita-thumbnail">
        <img src="{{ . | relURL }}" alt="{{ $.Title }}">
    </div>
    {{ end }}

    <hr class="single-berita-divider">
    
    <article class="laporan-content">
        {{ .Content }}
    </article>

    {{ with .Params.tags }}
    <div class="single-berita-tags">
        <span class="tag-label">Tag:</span>
        {{ range . }}
        <a href="{{ "tags/" | relURL }}{{ . | urlize }}" class="tag-badge">#{{ . }}</a>
        {{ end }}
    </div>
    {{ end }}

    <div class="single-berita-back">
        <a href="/berita/">&larr; Kembali ke Daftar Berita</a>
    </div>
</section>
{{ end }}
